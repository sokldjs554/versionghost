services:
  - type: web
    name: versionghost
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn versionghost.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: VERSIONGHOST_STATE_DIR
        value: /tmp/versionghost
