[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "versionghost"
version = "0.1.0"
description = "AI compatibility agent that replays historical clients before live-service API changes ship."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
versionghost = "versionghost.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "sample_app/liveops_service/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["sample_app/"]

[tool.setuptools.packages.find]
include = ["versionghost*"]
exclude = ["sample_app*", "tests*", "scripts*", "artifacts*"]

[tool.setuptools.package-data]
versionghost = ["static/*.html", "static/*.css", "static/*.js"]
