name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m ruff check versionghost tests sample_app
      - run: python -m mypy versionghost
      - run: python -m versionghost.cli demo > /tmp/merge-packet.json
      - name: Verify offline demo verdict
        run: python -c 'import json; p=json.load(open("/tmp/merge-packet.json")); assert p["verdict"] == "ready_with_evidence" and len(p["attempts"]) == 2'
